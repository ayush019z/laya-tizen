<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Laya Playlist Importer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090f;
      --card: rgba(22, 22, 32, 0.92);
      --accent: #1db954;
      --glow: rgba(29, 185, 84, 0.45);
      --green: #4ade80;
      --yellow: #facc15;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
    }
    .badge {
      font-size: 12px;
      font-weight: 800;
      padding: 5px 12px;
      background: rgba(250, 204, 21, 0.18);
      border-radius: 12px;
      border: 1px solid var(--yellow);
      color: var(--yellow);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .badge.connected {
      background: rgba(74, 222, 128, 0.18);
      border-color: var(--green);
      color: var(--green);
    }
    .import-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }
    .card-title {
      font-size: 19px;
      font-weight: 800;
    }
    .card-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.45;
      margin-top: 4px;
    }
    .supported-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .platform-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: rgba(10, 10, 16, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(29, 185, 84, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .result-box {
      display: none;
      background: rgba(74, 222, 128, 0.15);
      border: 1.5px solid var(--green);
      border-radius: 18px;
      padding: 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      text-align: center;
      line-height: 1.4;
    }
  </style>
  <script src="js/lib/paho-mqtt.min.js"></script>
  <script>
    if (!window.Paho) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"><\/script>');
    }
  </script>
  <script src="js/providers/remote-bridge.js"></script>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#1db954;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span>Laya Importer</span>
    </div>
    <div class="badge" id="tv-room-badge" title="Tap to change room code">TV: Connecting...</div>
  </div>

  <div class="import-card">
    <div>
      <div class="card-title">Send Playlist to Samsung TV</div>
      <div class="card-sub">Paste any playlist link from Spotify, JioSaavn, Apple Music, or YouTube Music:</div>
    </div>

    <div class="supported-badges">
      <div class="platform-pill">🟢 Spotify</div>
      <div class="platform-pill">🎵 JioSaavn</div>
      <div class="platform-pill">🍎 Apple Music</div>
      <div class="platform-pill">▶️ YouTube Music</div>
    </div>

    <textarea id="playlist-input" placeholder="Paste playlist link or artist - song names here..."></textarea>

    <button id="btn-submit-import" class="btn-submit">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span id="btn-submit-label">Send to TV</span>
    </button>

    <div id="result-box" class="result-box">
      🎉 Sent to your Samsung TV! Check your TV screen as the songs are resolved.
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = (urlParams.get('room') || '').replace(/^LAYA-/i, '').trim();
    if (!roomCode) {
      roomCode = prompt('Enter 4-digit TV Code shown on your screen:', '8842') || '8842';
      roomCode = roomCode.replace(/^LAYA-/i, '').trim();
    }

    const badge = document.getElementById('tv-room-badge');
    if (badge) {
      badge.textContent = 'TV: ' + roomCode;
      badge.addEventListener('click', () => {
        const newCode = prompt('Enter TV Code:', roomCode);
        if (newCode) {
          window.location.href = window.location.pathname + '?room=' + encodeURIComponent(newCode.trim());
        }
      });
    }

    const submitBtn = document.getElementById('btn-submit-import');
    const submitLabel = document.getElementById('btn-submit-label');
    const input = document.getElementById('playlist-input');
    const resultBox = document.getElementById('result-box');

    // Initialize Real-time Remote Bridge via WebSockets
    if (window.RemoteBridge) {
      window.RemoteBridge.initMobile(roomCode, (data) => {
        if (data.type === 'TV_ACK') {
          badge.className = 'badge connected';
          badge.textContent = '🟢 TV LINKED (' + roomCode + ')';
        } else if (data.type === 'IMPORT_ACK') {
          if (data.status === 'SUCCESS') {
            submitBtn.style.background = '#4ade80';
            submitLabel.textContent = `✅ Imported ${data.trackCount ? '(' + data.trackCount + ' songs)' : 'Successfully'}!`;
            resultBox.innerHTML = `🎉 <strong>Success!</strong> "${data.playlistName || 'Playlist'}" has been added to your TV Library.`;
            resultBox.style.display = 'block';
            input.value = '';
            setTimeout(() => {
              submitBtn.style.background = 'linear-gradient(135deg, #1db954 0%, #1ed760 100%)';
              submitLabel.textContent = 'Send Another Playlist';
            }, 4000);
          } else if (data.status === 'ERROR') {
            submitBtn.style.background = '#ef4444';
            submitLabel.textContent = '❌ Import failed on TV';
            resultBox.innerHTML = `⚠️ <strong>Error on TV:</strong> ${data.error || 'Could not parse playlist'}. Please verify link or paste song titles.`;
            resultBox.style.display = 'block';
            setTimeout(() => {
              submitBtn.style.background = 'linear-gradient(135deg, #1db954 0%, #1ed760 100%)';
              submitLabel.textContent = 'Send to TV';
            }, 4000);
          } else {
            submitBtn.style.background = '#38bdf8';
            submitLabel.textContent = '⏳ TV is importing songs...';
          }
        }
      });
    }

    submitBtn.addEventListener('click', () => {
      const val = input.value.trim();
      if (!val) {
        alert('Please paste a playlist link or song names first');
        return;
      }

      submitLabel.textContent = 'Transferring to TV...';
      submitBtn.style.opacity = '0.7';

      const sent = window.RemoteBridge && window.RemoteBridge.send({
        type: 'PLAYLIST_IMPORT',
        content: val,
        room: roomCode,
        time: Date.now()
      });

      if (sent) {
        setTimeout(() => {
          submitBtn.style.opacity = '1';
          submitBtn.style.background = '#4ade80';
          submitLabel.textContent = '✅ Sent to TV!';
          resultBox.style.display = 'block';
          input.value = '';
        }, 400);
      } else {
        submitBtn.style.opacity = '1';
        submitLabel.textContent = 'Send to TV';
        alert('Could not reach TV yet. Make sure your Samsung TV is on and on the same room code (' + roomCode + ')!');
      }
    });
  </script>
</body>
</html>
