<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Laya Playlist Importer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090f;
      --card: rgba(22, 22, 32, 0.9);
      --accent: #ff2a6d;
      --glow: rgba(255, 42, 109, 0.45);
      --green: #4ade80;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .import-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }
    .card-title {
      font-size: 19px;
      font-weight: 800;
    }
    .card-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.45;
    }
    .supported-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .platform-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: rgba(10, 10, 16, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff2a6d 0%, #8a2387 100%);
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(255, 42, 109, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .result-box {
      display: none;
      background: rgba(74, 222, 128, 0.15);
      border: 1.5px solid var(--green);
      border-radius: 18px;
      padding: 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#ff2a6d;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span>Laya Importer</span>
    </div>
    <div class="badge">TV LINKED</div>
  </div>

  <div class="import-card">
    <div>
      <div class="card-title">Send Playlist to Samsung TV</div>
      <div class="card-sub">Paste any playlist link from Spotify, JioSaavn, Apple Music, or YouTube Music below:</div>
    </div>

    <div class="supported-badges">
      <div class="platform-pill">🟢 Spotify</div>
      <div class="platform-pill">🎵 JioSaavn</div>
      <div class="platform-pill">🍎 Apple Music</div>
      <div class="platform-pill">▶️ YouTube Music</div>
    </div>

    <textarea id="playlist-input" placeholder="Paste playlist URL or list of songs here..."></textarea>

    <button id="btn-submit-import" class="btn-submit">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span>Send to TV</span>
    </button>

    <div id="result-box" class="result-box">
      🎉 Sent to your Samsung TV! Check your TV screen.
    </div>
  </div>

  <script>
    const submitBtn = document.getElementById('btn-submit-import');
    const input = document.getElementById('playlist-input');
    const resultBox = document.getElementById('result-box');

    submitBtn.addEventListener('click', () => {
      const val = input.value.trim();
      if (!val) {
        alert('Please paste a playlist link or song names');
        return;
      }

      submitBtn.textContent = 'Transferring to TV...';
      submitBtn.style.opacity = '0.7';

      try {
        localStorage.setItem('layatv_pending_import', JSON.stringify({
          url: val,
          timestamp: Date.now()
        }));

        setTimeout(() => {
          submitBtn.textContent = 'Sent Successfully!';
          submitBtn.style.background = '#4ade80';
          submitBtn.style.opacity = '1';
          resultBox.style.display = 'block';
          input.value = '';
        }, 600);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });
  </script>
</body>
</html>
